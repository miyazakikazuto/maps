<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Trail GPS — Pelacak Jalur Pendakian Offline</title>
    <link rel="stylesheet" href="./vendor/leaflet.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="offroute" hidden></div>
      <div id="map">
        <button id="btnMenu" title="Menu">☰</button>
        <button id="btnMap" title="Ganti peta (OSM/Topo)">🗺</button>
        <div id="compass" title="Arah hadap">
          <div id="compassArrow">↑N</div>
          <div id="compassDeg">–</div>
        </div>
      </div>
      <div id="topbar">
        <span id="onlineDot" class="dot offline" title="Status jaringan"></span>
        <span id="statusText">Menyiapkan…</span>
        <span id="zoomInfo" title="Level zoom peta">Z–</span>
      </div>
      <div id="panel">        <div class="btns">
          <button id="btnCenter" title="Lokasi saya">📍</button>
          <button id="btnStart" class="primary" title="Mulai rekam">▶</button>
          <button id="btnStop" disabled title="Stop">■</button>
          <button id="btnFollow" title="Ikuti">🧭</button>
          <button id="btnTrail" title="Ke trail">🎯</button>
          <button id="btnDownload" title="Download area">⬇</button>
          <button id="btnLoad" title="Muat trail">📂</button>
          <button id="btnExport" title="Export GeoJSON">⤓J</button>
          <button id="btnExportGpx" title="Export GPX">⤓G</button>
          <button id="btnClear" title="Bersihkan">🗑</button>
          <button id="btnHideTrack" title="Sembunyikan/tampilkan jalur kamu">👁</button>
          <button id="btnResetRot" title="Reset arah">🔄</button>
          <input
            id="fileInput"
            type="file"
            accept=".geojson,.gpx,application/geo+json,application/json,application/gpx+xml"
            hidden
          />
        </div>
        <div id="readout">
          <div>Titik <b id="ptCount">0</b></div>
          <div>Jarak <b id="dist">0 m</b></div>
          <div>Gain <b id="gain">0 m</b></div>
          <div>Durasi <b id="dur">0:00</b></div>
          <div>Pace <b id="pace">–</b></div>
          <div>Kecepatan <b id="speed">–</b></div>
          <div>Akurasi <b id="acc">–</b></div>
          <div>Lat/Lng <b id="ll">–</b></div>
        </div>
        <div id="legend">
          <span class="lg green"></span> Kamu
          <span class="lg blue"></span> Trail
        </div>
        <div id="progress" hidden></div>
      </div>
    </div>

    <script src="./vendor/leaflet.js"></script>
    <script src="./vendor/leaflet-rotate.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
