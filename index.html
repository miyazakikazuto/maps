<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Trail GPS — Pelacak Jalur Pendakian Offline</title>
    <link rel="stylesheet" href="./vendor/leaflet.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="panel">
        <div id="status">
          <span id="onlineDot" class="dot offline" title="Status jaringan"></span>
          <span id="statusText">Menyiapkan…</span>
        </div>
        <div class="btns">
          <button id="btnCenter">📍 Lokasi Saya</button>
          <button id="btnStart">▶ Mulai Rekam</button>
          <button id="btnStop" disabled>■ Stop</button>
          <button id="btnFollow">🧭 Ikuti: ON</button>
          <button id="btnTrail">🎯 Ke Trail</button>
          <button id="btnDownload">⬇ Download Area</button>
          <button id="btnLoad">📂 Muat Trail</button>
          <button id="btnExport">⤓ Export GeoJSON</button>
          <button id="btnExportGpx">⤓ Export GPX</button>
          <button id="btnClear">🗑 Bersihkan</button>
          <button id="btnResetRot">🔄 Reset Arah</button>
          <input
            id="fileInput"
            type="file"
            accept=".geojson,.gpx,application/geo+json,application/json,application/gpx+xml"
            hidden
          />
        </div>
        <div id="readout">
          <div>Titik: <b id="ptCount">0</b></div>
          <div>Jarak: <b id="dist">0 m</b></div>
          <div>Gain: <b id="gain">0 m</b></div>
          <div>Akurasi: <b id="acc">–</b></div>
          <div>Lat/Lng: <b id="ll">–</b></div>
        </div>
        <div id="legend">
          <span class="lg green"></span> Jalur kamu (real-time) &nbsp;
          <span class="lg blue"></span> Trail rencana (dari file)
        </div>
        <div id="progress" hidden></div>
      </div>
    </div>

    <script src="./vendor/leaflet.js"></script>
    <script src="./vendor/leaflet-rotate.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
